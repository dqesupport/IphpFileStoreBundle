doctrine:
    orm:
        auto_generate_proxy_classes: '%kernel.debug%'
        entity_managers:
            default:
                mappings:
                    TestBundle:
                        type: attribute
                        dir: 'Entity'
                        prefix: 'Iphp\FileStoreBundle\Tests\Functional\TestBundle\Entity'
                    TestXmlConfigBundle:
                        type: xml
                        dir: 'Resources/config/doctrine'
                        prefix: 'Iphp\FileStoreBundle\Tests\Functional\TestXmlConfigBundle\Entity'
