imports:
    - { resource: framework.yml }
    - { resource: doctrine.yml }
    - { resource: twig.yml }
    - { resource: database.php }


iphp_file_store:
    mappings:
       file:
           upload_dir:  '%kernel.test_env_dir%/web/other/uploads'
           upload_path: /other/uploads

           directory_namer:
               property: ~

           namer:
               property:
                  params: { field: title}
               translit: ~


services:
    _defaults:
        autowire: true
        autoconfigure: true

    Iphp\FileStoreBundle\Tests\Functional\TestBundle\Controller\DefaultController:
        public: true
        tags: ['controller.service_arguments']
