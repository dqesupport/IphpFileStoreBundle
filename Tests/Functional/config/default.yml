imports:
    - { resource: framework.yml }
    - { resource: doctrine.yml }
    - { resource: twig.yml }
    - { resource: database.php }


iphp_file_store:
    mappings:
       photo:
           upload_dir:  '%kernel.test_env_dir%/web/photo'
           upload_path: /photo
           directory_namer:
              date:
                 params: { field : date, depth : month }
           namer: ~


       file:
           upload_dir:  '%kernel.test_env_dir%/web/file'
           upload_path: /file

           directory_namer:
               entityName: ~
               property:
                   params: { use_field_name : true }
               date:
                   params: { field : date, depth : year }
           namer:
               property: ~


services:
    _defaults:
        autowire: true
        autoconfigure: true

    Iphp\FileStoreBundle\Tests\Functional\TestBundle\Controller\DefaultController:
        public: true
        tags: ['controller.service_arguments']
